services:
  web:
    build: ./backend
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file:
      - .env

  scraper-job:
    build:
      context: ./backend
      dockerfile: athlete_image_service/Dockerfile
    env_file:
      - .env
    depends_on:
      - web
      - pubsub

  image-worker-job:
    build:
      context: ./backend
      dockerfile: image_worker_service/Dockerfile
    env_file:
      - .env
    depends_on:
      - web
      - pubsub
  
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=UFC_FANTASY_APP

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      - pubsub
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GOOGLE_CLOUD_PROJECT=local-project
    command: >
      sh -c "
      sleep 5 &&
      gcloud pubsub topics create image-jobs --project=local-project || true &&
      gcloud pubsub subscriptions create image-worker-sub --topic=image-jobs --project=local-project || true
      "