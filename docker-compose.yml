services:
  web:
    build: ./backend
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PIPELINE_API_BASE_URL: http://web:8000
      BASE_API_URL: http://web:8000
      WORKER_IDLE_SHUTDOWN_ENABLED: "false"
    depends_on:
      - pubsub
      - pubsub-init

  scraper-job:
    build:
      context: ./backend
      dockerfile: athlete_image_service/Dockerfile
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      BASE_API_URL: http://web:8000
    depends_on:
      - web
      - pubsub
      - pubsub-init

  image-worker-job:
    build:
      context: ./backend
      dockerfile: image_worker_service/Dockerfile
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      BASE_API_URL: http://web:8000
      WORKER_IDLE_SHUTDOWN_ENABLED: "false"
    depends_on:
      - web
      - pubsub
      - pubsub-init

  fighter-profile-worker:
    build: ./backend
    command: python -m ufc_data_pipeline.fighters.fighter_profile.fighter_profile_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PIPELINE_API_BASE_URL: http://web:8000
      WORKER_IDLE_SHUTDOWN_ENABLED: "false"
    depends_on:
      - web
      - pubsub
      - pubsub-init

  fights-in-event-worker:
    build: ./backend
    command: python -m ufc_data_pipeline.fights.fights_in_event.fights_in_event_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PIPELINE_API_BASE_URL: http://web:8000
      WORKER_IDLE_SHUTDOWN_ENABLED: "false"
    depends_on:
      - web
      - pubsub
      - pubsub-init

  fight-stats-worker:
    build: ./backend
    command: python -m ufc_data_pipeline.fights.fight_stats.fight_stats_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PIPELINE_API_BASE_URL: http://web:8000
      WORKER_IDLE_SHUTDOWN_ENABLED: "false"
      WORKER_MAX_MESSAGES: "3"
    depends_on:
      - web
      - pubsub
      - pubsub-init

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=local-project

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      - pubsub
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GOOGLE_CLOUD_PROJECT=local-project
      - CLOUDSDK_API_ENDPOINT_OVERRIDES_PUBSUB=http://pubsub:8085/
    command: >
      sh -c "
      sleep 5 &&
      gcloud config set auth/disable_credentials true &&
      gcloud config set project local-project &&
      (gcloud pubsub topics create image-jobs --project=local-project || true) &&
      (gcloud pubsub subscriptions create image-worker-sub --topic=image-jobs --project=local-project || true) &&
      (gcloud pubsub topics create fights-in-event --project=local-project || true) &&
      (gcloud pubsub subscriptions create fights-in-event-sub --topic=fights-in-event --project=local-project || true) &&
      (gcloud pubsub topics create fighter-profile-jobs --project=local-project || true) &&
      (gcloud pubsub subscriptions create fighter-profile-jobs-sub --topic=fighter-profile-jobs --project=local-project || true) &&
      (gcloud pubsub topics create fight-stats-jobs --project=local-project || true) &&
      (gcloud pubsub subscriptions create fight-stats-jobs-sub --topic=fight-stats-jobs --project=local-project || true) &&
      (gcloud pubsub topics create career-stats-jobs --project=local-project || true) &&
      (gcloud pubsub subscriptions create career-stats-jobs-sub --topic=career-stats-jobs --project=local-project || true)
      "
